name: diag
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "orders | positions | both"
        default: "both"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnose Alpaca orders/positions endpoints
        env:
          APCA_API_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          APCA_API_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.error, ssl
          KEY = os.environ.get("APCA_API_KEY_ID")
          SEC = os.environ.get("APCA_API_SECRET")
          BASE = "https://paper-api.alpaca.markets/v2"
          H = {"APCA-API-KEY-ID": KEY or "", "APCA-API-SECRET-KEY": SEC or ""}
          mode = "${{ github.event.inputs.mode }}"

          def show(path, label):
              try:
                  req = urllib.request.Request(f"{BASE}{path}", headers=H)
                  with urllib.request.urlopen(req, timeout=15) as r:
                      print(f"[{label}] GET {path} -> HTTP {r.status}")
                      print(f"[{label}] body: {r.read().decode()[:600]}")
              except urllib.error.HTTPError as e:
                  print(f"[{label}] GET {path} -> HTTP {e.code}")
                  print(f"[{label}] body: {e.read().decode()[:600]}")
              except Exception as e:
                  print(f"[{label}] GET {path} -> EXC {type(e).__name__}: {e}")

          if mode in ("orders", "both"):
              show("/orders?status=open&limit=50&nested=false", "open")
              # 全量今日订单(不截断)
              try:
                  req = urllib.request.Request(f"{BASE}/orders?status=all&limit=100&nested=false&after=2026-10-15T12:00:00Z", headers=H)
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read().decode()
                  orders = json.loads(body)
                  print(f"[today-all] n_orders={len(orders)}")
                  from collections import Counter
                  c = Counter((o['symbol'], o['side'], o['status']) for o in orders)
                  for (sym, side, st), n in sorted(c.items()):
                      print(f"[today-all] {sym} {side} {st} x{n}")
                  for o in sorted(orders, key=lambda x: x['filled_at'] or x['created_at']):
                      if o.get('status') == 'filled':
                          print(f"[fill] {o['created_at'][11:19]} {o['side']} {o['symbol']} qty={o['qty']} filled={o['filled_qty']} @{o['filled_avg_price']}")
              except Exception as e:
                  print(f"[today-all] EXC {e}")
              show("/orders?status=open&symbols=LMT", "open-LMT")
          if mode in ("positions", "both"):
              show("/positions", "positions")
          if mode == "testorder":
              # 挂一个远离市价的测试单(不会成交), 验证 status=open 能否查到挂单
              import urllib.request as u
              def call(method, path, body=None):
                  data = json.dumps(body).encode() if body is not None else None
                  req = u.Request(f"{BASE}{path}", data=data, headers={**H, "Content-Type": "application/json"}, method=method)
                  try:
                      with u.urlopen(req, timeout=15) as r:
                          return r.status, r.read().decode()
                  except u.error.HTTPError as e:
                      return e.code, e.read().decode()

              # 用 F(福特) 做测试: 当前价查询
              st, body = call("GET", "/positions")
              print(f"[test] positions HTTP {st}, n={len(json.loads(body)) if st==200 else body[:200]}")
              st, q = call("GET", "/orders?status=open&limit=50&nested=false")
              print(f"[test] pre-check open orders: HTTP {st} n={len(json.loads(q)) if st==200 else q[:200]}")
              # 挂测试单: buy 1 F @ 8.00 (远低于市价, 不会成交)
              st, body = call("POST", "/orders", {"symbol": "F", "qty": "1", "side": "buy",
                                                  "type": "limit", "limit_price": "8.00",
                                                  "time_in_force": "day"})
              print(f"[test] place buy 1 F @ 8.00: HTTP {st} {body[:200]}")
              oid = None
              try:
                  oid = json.loads(body).get("id")
              except Exception:
                  pass
              # 同款请求查挂单(与 alpaca_trade.py open_orders() 完全一致)
              st, body = call("GET", "/orders?status=open&limit=50&nested=false")
              print(f"[test] AFTER place, status=open&limit=50&nested=false: HTTP {st} body={body[:400]}")
              st, body = call("GET", "/orders?status=open&limit=50")
              print(f"[test] AFTER place, status=open&limit=50 (no nested): HTTP {st} body={body[:400]}")
              st, body = call("GET", "/orders?status=open&symbols=F")
              print(f"[test] AFTER place, status=open&symbols=F: HTTP {st} body={body[:400]}")
              st, body = call("GET", "/orders?status=all&limit=10")
              print(f"[test] AFTER place, status=all&limit=10: HTTP {st} body={body[:400]}")
              # 清理: 撤掉测试单
              if oid:
                  st, body = call("DELETE", f"/orders/{oid}")
                  print(f"[test] cancel test order: HTTP {st} {body[:120]}")
              st, body = call("GET", "/orders?status=open&limit=50&nested=false")
              print(f"[test] after cancel, status=open: HTTP {st} body={body[:200]}")
          if mode in ("probe", "both"):
              # 高频轮询: 测 open_orders 端点稳定性(复现盘中 silent failure)
              import time
              fails = 0
              for i in range(20):
                  try:
                      req = urllib.request.Request(f"{BASE}/orders?status=open&limit=50", headers=H)
                      with urllib.request.urlopen(req, timeout=15) as r:
                          code = r.status
                          n = len(json.loads(r.read().decode()))
                  except urllib.error.HTTPError as e:
                      code, n = e.code, -1
                  except Exception:
                      code, n = -1, -1
                  if code != 200:
                      fails += 1
                      print(f"[probe] #{i} HTTP {code} <-- FAIL")
                  time.sleep(3)
              print(f"[probe] done: {fails}/20 failures")
          print(f"[env] key_len={len(KEY or '')} sec_len={len(SEC or '')}")
          PYEOF
