name: diag
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "orders | positions | both"
        default: "both"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnose Alpaca orders/positions endpoints
        env:
          APCA_API_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          APCA_API_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.error, ssl
          KEY = os.environ.get("APCA_API_KEY_ID")
          SEC = os.environ.get("APCA_API_SECRET")
          BASE = "https://paper-api.alpaca.markets/v2"
          H = {"APCA-API-KEY-ID": KEY or "", "APCA-API-SECRET-KEY": SEC or ""}
          mode = "${{ github.event.inputs.mode }}"

          def show(path, label):
              try:
                  req = urllib.request.Request(f"{BASE}{path}", headers=H)
                  with urllib.request.urlopen(req, timeout=15) as r:
                      print(f"[{label}] GET {path} -> HTTP {r.status}")
                      print(f"[{label}] body: {r.read().decode()[:600]}")
              except urllib.error.HTTPError as e:
                  print(f"[{label}] GET {path} -> HTTP {e.code}")
                  print(f"[{label}] body: {e.read().decode()[:600]}")
              except Exception as e:
                  print(f"[{label}] GET {path} -> EXC {type(e).__name__}: {e}")

          if mode in ("orders", "both"):
              show("/orders?status=open&limit=50&nested=false", "open")
              show("/orders?status=all&limit=100&nested=false&after=2026-10-15T12:00:00Z", "today-all")
              show("/orders?status=open&symbols=LMT", "open-LMT")
          if mode in ("positions", "both"):
              show("/positions", "positions")
          if mode in ("probe", "both"):
              # 高频轮询: 测 open_orders 端点稳定性(复现盘中 silent failure)
              import time
              fails = 0
              for i in range(20):
                  try:
                      req = urllib.request.Request(f"{BASE}/orders?status=open&limit=50", headers=H)
                      with urllib.request.urlopen(req, timeout=15) as r:
                          code = r.status
                          n = len(json.loads(r.read().decode()))
                  except urllib.error.HTTPError as e:
                      code, n = e.code, -1
                  except Exception:
                      code, n = -1, -1
                  if code != 200:
                      fails += 1
                      print(f"[probe] #{i} HTTP {code} <-- FAIL")
                  time.sleep(3)
              print(f"[probe] done: {fails}/20 failures")
          print(f"[env] key_len={len(KEY or '')} sec_len={len(SEC or '')}")
          PYEOF
