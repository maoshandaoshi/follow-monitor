name: usmart-follow-monitor

on:
  schedule:
    # 美股盘中(覆盖夏/冬令时, 脚本内部再精确判断纽约时间): 每 5 分钟
    - cron: "*/5 13-21 * * 1-5"
    # 每周日 14:00(北京时间) 保活+周报: 防止 60 天无活动被 GitHub 自动停用
    - cron: "0 6 * * 0"
  workflow_dispatch: {}   # 手动触发 = 随时查询, 在 Actions 页面点 Run workflow

permissions:
  contents: write          # 允许把状态 commit 回仓库

concurrency:
  group: usmart-follow-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MANUAL: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          USMART_PHONE:       ${{ secrets.USMART_PHONE }}
          USMART_PASSWORD:    ${{ secrets.USMART_PASSWORD }}
          USMART_PUBLIC_KEY:  ${{ secrets.USMART_PUBLIC_KEY }}
          USMART_PRIVATE_KEY: ${{ secrets.USMART_PRIVATE_KEY }}
          PUSH_WEBHOOK:       ${{ secrets.PUSH_WEBHOOK }}
          TG_CHAT_ID:         ${{ secrets.TG_CHAT_ID }}
        run: python follow_action.py

      - name: Run alpaca mirror trader
        env:
          ALPACA_KEY_ID:     ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET:      ${{ secrets.ALPACA_SECRET }}
          PUSH_WEBHOOK:       ${{ secrets.PUSH_WEBHOOK }}
        run: python alpaca_trade.py

      - name: Commit state changes
        run: |
          git config user.name  "follow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no state change, skip commit"
          else
            git commit -m "auto: snapshot update $(date -u +'%F %T')"
            git push
          fi
