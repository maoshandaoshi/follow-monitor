name: usmart-follow-monitor

on:
  schedule:
    # 会话启动器: 启动后程序自己在云端连续轮询(不依赖 cron 准点)。
    # GitHub schedule 会整班丢失(2026-10-14 全天 22 个时点零 run;
    # 2026-10-16 开盘班次也没触发, 13:07 NY 才起跑, 盈立 10:30 的调仓
    # 因此晚了 2.5 小时才发现), 所以:
    #   1) 盘前 8:45 NY(12:45 UTC, 夏令时)起即可启动 —— session.py 会等到
    #      9:30 开盘再接棒, 对开盘 cron 的延迟有 ~45 分钟免疫力;
    #   2) 全天每 10 分钟一个触发点(49 个/天), gate 守卫对活会话秒退,
    #      没有活会话就补上, 最大化"至少打中一枪"的概率。
    - cron: "*/10 12-20 * * 1-5"
    # 每周日 06:00 UTC 保活: 防止 60 天无活动被 GitHub 自动停用
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "query=单次查询(默认, 只推送不交易); session=启动盘中长会话(90s 轮询+自动交易)"
        required: false
        default: "query"
        type: choice
        options:
          - query
          - session
  push:
    branches: [main]          # 代码更新后自动起一段会话, 立即生效

permissions:
  contents: write             # 允许把状态 commit 回仓库
  actions: read               # gate job 的守卫需要读 runs 列表

jobs:
  # ============================================================
  # gate: 启动前自检。无并发组, ~15s 完成。
  # 决定本次触发是否启动会话, 结果通过 outputs 传给 session job。
  # 守卫脚本 guard.py(仓库根目录) —— 旧版内嵌 heredoc 没有 GH_TOKEN,
  # gh run list 在 runner 里返回空导致永远 fail-open, 形同虚设。
  # ============================================================
  gate:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'session'
    runs-on: ubuntu-latest
    outputs:
      start:  ${{ steps.guard.outputs.start }}
      action: ${{ steps.guard.outputs.action }}
    steps:
      - uses: actions/checkout@v4
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python3 guard.py

  # ============================================================
  # query: 手动 mode=query。单次查询, 只推送状态, 不交易。
  # 独立并发组, 不被盘中会话堵住; DATA_DIR 指向临时目录,
  # 读的是正式状态的副本, 写出的东西不进仓库。
  # ============================================================
  query:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'session'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: usmart-follow-query
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Manual query (one-shot)
        env:
          MANUAL: "true"
          DATA_DIR: /tmp/qdata
          USMART_PHONE:       ${{ secrets.USMART_PHONE }}
          USMART_PASSWORD:    ${{ secrets.USMART_PASSWORD }}
          USMART_PUBLIC_KEY:  ${{ secrets.USMART_PUBLIC_KEY }}
          USMART_PRIVATE_KEY: ${{ secrets.USMART_PRIVATE_KEY }}
          ALPACA_KEY_ID:      ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET:      ${{ secrets.ALPACA_SECRET }}
          PUSH_WEBHOOK:       ${{ secrets.PUSH_WEBHOOK }}
          PUSH_WEBHOOK_FEISHU: ${{ secrets.PUSH_WEBHOOK_FEISHU }}
          TG_CHAT_ID:         ${{ secrets.TG_CHAT_ID }}
        run: |
          rm -rf /tmp/qdata && (cp -r data /tmp/qdata 2>/dev/null || mkdir -p /tmp/qdata)
          python follow_action.py
          python alpaca_trade.py

  # ============================================================
  # session: 盘中长会话, 内部每 90 秒轮询 + 自动交易。
  # 需要 gate 放行; gate 崩了也 fail-open 启动(丢监控比重复启动更糟)。
  # 并发组保证绝不并发下单; 冗余触发在 gate 就秒退, 不会排队堆积。
  # ============================================================
  session:
    needs: gate
    if: "!cancelled() && (needs.gate.outputs.start == 'true' || needs.gate.result == 'failure')"
    runs-on: ubuntu-latest
    timeout-minutes: 355      # 会话最长 5h + 余量 (GitHub 单任务上限 6h)
    concurrency:
      group: usmart-follow-monitor
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Market session (poll loop)
        env:
          LOOP_INTERVAL: "90"
          LOOP_MAX_HOURS: "5"
          USMART_PHONE:       ${{ secrets.USMART_PHONE }}
          USMART_PASSWORD:    ${{ secrets.USMART_PASSWORD }}
          USMART_PUBLIC_KEY:  ${{ secrets.USMART_PUBLIC_KEY }}
          USMART_PRIVATE_KEY: ${{ secrets.USMART_PRIVATE_KEY }}
          ALPACA_KEY_ID:      ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET:      ${{ secrets.ALPACA_SECRET }}
          PUSH_WEBHOOK:       ${{ secrets.PUSH_WEBHOOK }}
          PUSH_WEBHOOK_FEISHU: ${{ secrets.PUSH_WEBHOOK_FEISHU }}
          TG_CHAT_ID:         ${{ secrets.TG_CHAT_ID }}
        run: python session.py

      - name: Commit state changes
        if: always()
        run: |
          git config user.name  "follow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no state change, skip commit"
          else
            git commit -m "auto: snapshot update $(date -u +'%F %T')"
            git push \
              || { git pull --rebase --autostash && git push; } \
              || { git rebase --abort 2>/dev/null || true; git pull --no-rebase --no-edit -X ours && git push; }
          fi

  # ============================================================
  # keepalive: 周日保活 cron。只需要仓库有活动, 不启动会话。
  # ============================================================
  keepalive:
    needs: gate
    if: needs.gate.outputs.action == 'keepalive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Weekly keepalive commit
        run: |
          git config user.name  "follow-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "chore: weekly keepalive" \
            && git push -q origin HEAD:main || echo "[KEEPALIVE] nothing to push"
